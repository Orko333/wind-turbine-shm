# Централізована конфігурація системи моніторингу вітрової турбіни
# Усі гіперпараметри моделей, шляхи та порогові значення зосереджені тут.

# ------------------------------------------------------------------ #
#  Шляхи до файлів                                                    #
# ------------------------------------------------------------------ #
paths:
  models_dir: "models/checkpoints"
  data_dir: "data/synthetic"
  scada_file: "data/synthetic/scada_data.parquet"
  hf_file: "data/synthetic/hf_windows.parquet"

# ------------------------------------------------------------------ #
#  API-сервер                                                         #
# ------------------------------------------------------------------ #
api:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"

# ------------------------------------------------------------------ #
#  Фізичні параметри турбіни                                          #
# ------------------------------------------------------------------ #
turbine:
  rotor_diameter_m: 90.0
  hub_height_m: 100.0
  rated_power_kw: 2000.0
  cut_in_speed_ms: 3.0
  rated_speed_ms: 12.0
  cut_out_speed_ms: 25.0
  design_lifetime_years: 20

# ------------------------------------------------------------------ #
#  Генератор синтетичних даних                                        #
# ------------------------------------------------------------------ #
data_generator:
  n_timesteps: 8760             # 1 рік × 10-хв записи (6 на годину)
  scada_interval_min: 10
  weibull_shape_k: 2.1
  weibull_scale_c: 8.0          # середня швидкість вітру [м/с]
  turbulence_intensity: 0.12
  hf_sampling_rate_hz: 100.0
  hf_window_size: 1000          # відліків на вікно
  n_hf_windows: 500
  random_seed: 42

# ------------------------------------------------------------------ #
#  Аналіз втоми                                                       #
# ------------------------------------------------------------------ #
fatigue:
  sn_curve_category: "FAT71"    # Категорія деталі IIW для зварного з'єднання башти
  miner_failure_threshold: 1.0
  alert_thresholds:
    green: 0.3
    yellow: 0.6
    orange: 0.85
    red: 1.0

# ------------------------------------------------------------------ #
#  RUL-оцінювач                                                       #
# ------------------------------------------------------------------ #
rul_estimator:
  method: "ewma"                # "linear" | "ewma" | "bayesian"
  ewma_alpha: 0.3               # коефіцієнт згладжування EWMA
  min_history: 12               # мінімум точок для початку екстраполяції
  confidence_level: 0.90        # довірчий інтервал для RUL

# ------------------------------------------------------------------ #
#  XGBoost — класифікатор пошкодження                                 #
# ------------------------------------------------------------------ #
xgboost_classifier:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  early_stopping_rounds: 30
  eval_metric: "mlogloss"
  n_splits_cv: 5                # k-fold крос-валідація

# ------------------------------------------------------------------ #
#  XGBoost — регресор DEL                                             #
# ------------------------------------------------------------------ #
xgboost_regressor:
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 25
  eval_metric: "rmse"

# ------------------------------------------------------------------ #
#  LSTM-предиктор RUL                                                 #
# ------------------------------------------------------------------ #
lstm:
  input_size: 8                 # кількість SCADA-ознак
  seq_len: 24                   # довжина послідовності (24 × 10 хв = 4 год)
  hidden_size: 128
  num_layers: 2
  dropout: 0.25
  bidirectional: true
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 100
  patience: 15                  # рання зупинка
  huber_delta: 0.1
  grad_clip_norm: 1.0

# ------------------------------------------------------------------ #
#  Автокодер для виявлення аномалій                                   #
# ------------------------------------------------------------------ #
autoencoder:
  signal_length: 1000           # відліків у вхідному вікні
  latent_dim: 32
  num_conv_layers: 3
  base_channels: 16
  learning_rate: 0.001
  batch_size: 32
  epochs: 80
  patience: 10
  anomaly_threshold_sigma: 3.0  # поріг = mean + sigma * std похибок реконструкції

# ------------------------------------------------------------------ #
#  Виділення ознак                                                    #
# ------------------------------------------------------------------ #
features:
  hf_sampling_rate_hz: 100.0
  wavelet: "db4"
  wavelet_levels: 5
  scada_rolling_windows: [24, 144]  # 4 год та 1 доба

# ------------------------------------------------------------------ #
#  Розбивання датасету                                                #
# ------------------------------------------------------------------ #
dataset_split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  chronological: true           # зберігати часовий порядок
