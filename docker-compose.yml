version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wind-turbine-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wind_turbine_shm}
      POSTGRES_USER: ${POSTGRES_USER:-wind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wind_turbine_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wind_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wind-turbine
    restart: unless-stopped

  # Backend API (FastAPI)
  backend:
    build:
      context: ./wind_turbine_shm
      dockerfile: Dockerfile
    container_name: wind-turbine-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wind_user}:${POSTGRES_PASSWORD:-wind_turbine_pass}@postgres:5432/${POSTGRES_DB:-wind_turbine_shm}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-min-32-characters-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      NODE_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./wind_turbine_shm:/app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - wind-turbine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Next.js) — dev mode with hot reload for testing
  frontend:
    image: node:18
    container_name: wind-turbine-frontend
    working_dir: /app
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-nextauth-secret-min-32-characters}
    ports:
      - "3000:3000"
    volumes:
      - ./wind-turbine-frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    depends_on:
      - backend
    networks:
      - wind-turbine
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_next_cache:
    driver: local

networks:
  wind-turbine:
    driver: bridge
